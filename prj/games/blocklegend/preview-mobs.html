<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>BlockLegend · 角色 / 工具预览</title>
    <style>
        html, body { margin: 0; height: 100%; background: #1b1e24; color: #f4f0e6; font-family: sans-serif; }
        #stage { position: absolute; inset: 0; }
        .bar {
            position: absolute; left: 16px; top: 16px; z-index: 2;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 72%;
        }
        button {
            border: 0; border-radius: 8px; padding: 8px 14px;
            background: #3d6ec9; color: #fff; font-size: 15px; cursor: pointer;
        }
        button.is-on { background: #2a9d6a; }
        .tip { font-size: 13px; opacity: .8; }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" data-kind="creeper" class="is-on">苦力怕</button>
        <button type="button" data-kind="zombie">僵尸</button>
        <button type="button" data-kind="skeleton">骷髅</button>
        <button type="button" data-kind="spider">蜘蛛</button>
        <button type="button" data-kind="enderman">末影人</button>
        <button type="button" data-kind="piglin">猪灵</button>
        <button type="button" data-kind="witch">女巫</button>
        <button type="button" data-kind="wither">凋零</button>
        <button type="button" data-kind="chest">箱子</button>
        <button type="button" data-kind="furnace">熔炉</button>
        <button type="button" data-kind="torch">火把</button>
        <button type="button" data-kind="sword">剑</button>
        <button type="button" data-kind="iron_sword">铁剑</button>
        <button type="button" data-kind="pickaxe">镐</button>
        <button type="button" data-kind="axe">斧</button>
        <button type="button" data-kind="bow">弓</button>
        <button type="button" data-kind="shovel">铲</button>
        <button type="button" data-kind="arrow">箭</button>
        <button type="button" data-kind="shield">盾</button>
        <span class="tip">拖动旋转 · 滚轮缩放 · 已接入正式关卡</span>
    </div>
    <div id="stage"></div>
    <script src="./vendor/three.min.js?v=20260815-bl-s1"></script>
    <script src="./data/skins.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/voxelPix.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createCreeperModel.js?v=20260816-bl-i2t3"></script>
    <script src="./assets/img2threejs/createZombieModel.js?v=20260816-bl-i2t3"></script>
    <script src="./assets/img2threejs/createSkeletonModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createSpiderModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createEndermanModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createPiglinModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createWitchModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createWitherModel.js?v=20260816-bl-mobs2"></script>
    <script src="./assets/img2threejs/createTools3d.js?v=20260816-bl-tools1"></script>
    <script src="./assets/img2threejs/createProps3d.js?v=20260816-bl-mobs2"></script>
    <script>
    (function () {
        const THREE = window.THREE;
        const T = window.BlockLegendTools3d;
        const stage = document.getElementById('stage');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec8f0);
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 40);
        camera.position.set(2.4, 1.8, 3.4);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
        stage.appendChild(renderer.domElement);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.85));
        const sun = new THREE.DirectionalLight(0xfff4d6, 0.55);
        sun.position.set(4, 8, 3);
        scene.add(sun);
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshLambertMaterial({ color: 0x7a9a4a })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const factories = {
            creeper: function () { return window.BlockLegendCreeperModel.create(THREE); },
            zombie: function () { return window.BlockLegendZombieModel.create(THREE); },
            skeleton: function () { return window.BlockLegendSkeletonModel.create(THREE); },
            spider: function () { return window.BlockLegendSpiderModel.create(THREE); },
            enderman: function () { return window.BlockLegendEndermanModel.create(THREE); },
            piglin: function () { return window.BlockLegendPiglinModel.create(THREE); },
            witch: function () { return window.BlockLegendWitchModel.create(THREE); },
            wither: function () { return window.BlockLegendWitherModel.create(THREE); },
            chest: function () { return window.BlockLegendProps3d.createChest(THREE); },
            furnace: function () { return window.BlockLegendProps3d.createFurnace(THREE); },
            torch: function () { return window.BlockLegendProps3d.createTorch(THREE); },
            sword: function () { return T.createSword(THREE); },
            iron_sword: function () { return T.createIronSword(THREE); },
            pickaxe: function () { return T.createPickaxe(THREE); },
            axe: function () { return T.createAxe(THREE); },
            bow: function () { return T.createBow(THREE); },
            shovel: function () { return T.createShovel(THREE); },
            arrow: function () { return T.createArrow(THREE); },
            shield: function () { return T.createShield(THREE); }
        };

        let current = null;
        function show(kind) {
            if (current) scene.remove(current);
            current = factories[kind]();
            if (kind === 'spider') current.position.y = 0.2;
            if (kind === 'sword' || kind === 'iron_sword' || kind === 'pickaxe' || kind === 'axe' || kind === 'bow' || kind === 'shovel' || kind === 'arrow' || kind === 'shield' || kind === 'chest' || kind === 'furnace' || kind === 'torch') {
                current.position.y = 1.1;
            }
            scene.add(current);
            document.querySelectorAll('.bar button').forEach(function (btn) {
                btn.classList.toggle('is-on', btn.getAttribute('data-kind') === kind);
            });
        }
        show('creeper');
        document.querySelectorAll('.bar button').forEach(function (btn) {
            btn.onclick = function () { show(btn.getAttribute('data-kind')); };
        });

        let dragging = false, lx = 0, ly = 0, yaw = 0.6, pitch = 0.35, dist = 4.2;
        function onResize() {
            const w = stage.clientWidth, h = stage.clientHeight;
            camera.aspect = w / Math.max(1, h);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);
        onResize();
        stage.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; });
        window.addEventListener('pointerup', function () { dragging = false; });
        window.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            yaw -= (e.clientX - lx) * 0.008;
            pitch = Math.max(0.08, Math.min(1.2, pitch + (e.clientY - ly) * 0.008));
            lx = e.clientX; ly = e.clientY;
        });
        stage.addEventListener('wheel', function (e) {
            dist = Math.max(2.2, Math.min(8, dist + e.deltaY * 0.004));
        }, { passive: true });

        const clock = new THREE.Clock();
        function frame() {
            requestAnimationFrame(frame);
            const t = clock.getElapsedTime();
            if (current && current.userData.tick) current.userData.tick(t);
            if (current && !current.userData.tick) current.rotation.y = t * 0.6;
            camera.position.set(
                Math.cos(yaw) * Math.cos(pitch) * dist,
                1.1 + Math.sin(pitch) * dist,
                Math.sin(yaw) * Math.cos(pitch) * dist
            );
            camera.lookAt(0, 1.0, 0);
            renderer.render(scene, camera);
        }
        frame();
    }());
    </script>
</body>
</html>
