<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#2d8748">
    <title>花园保卫</title>
    <link rel="stylesheet" href="../shared/growth-hud.css">
    <link rel="stylesheet" href="./game.css?v=20260816-pass-v1">
</head>
<body data-world-game="garden-defense">
    <header class="world-bar">
        <div class="world-bar-copy">
            <span class="kicker">花园</span>
            <h1>花园保卫</h1>
            <p>种植物，守家园。</p>
        </div>
        <div class="growth-hud" id="wallet-hud" aria-live="polite"></div>
        <div class="world-bar-actions">
            <button type="button" class="world-tool" id="map-btn">关卡</button>
            <button type="button" class="world-tool" id="fullscreen-btn">全屏</button>
            <a class="world-back" id="back-link" href="../../preschool-workbench/index.html?theme=garden-defense#overview">返回工作台</a>
        </div>
    </header>
    <main class="world-shell">
        <section class="world-panel" id="panel-map">
            <h2 class="panel-title">选关 · <span id="stage-count">18</span></h2>
            <div class="zombie-showcase" id="zombie-showcase" aria-label="僵尸图鉴"></div>
            <div class="stage-map" id="stage-map" aria-label="18 个花园关卡"></div>
            <p class="today-goal" id="today-goal">今日小目标：先守一关，再去做一张字卡。</p>
            <p class="tip" id="progress-tip">加载中…</p>
        </section>
        <section class="world-panel is-hidden" id="panel-play">
            <div class="play-meta">
                <strong id="stage-title">第 1 关</strong>
                <span id="stage-blurb"></span>
                <span>打倒 <b id="kill-count">0</b>/<b id="kill-need">6</b></span>
                <span>能量 <b id="energy-count">0</b></span>
                <span>状态 <b id="run-status">准备</b></span>
                <button type="button" class="mod-badge" id="mod-badge" title="多认字可以解锁更强的僵尸和更多阳光">难度 · 统一</button>
            </div>
            <div class="seed-tray" id="seed-tray" aria-label="植物种子"></div>
            <div class="board-wrap">
                <canvas id="world-canvas" width="1280" height="540" aria-label="花园战场"></canvas>
                <div class="companion-hud" id="companion-hud" aria-live="polite">
                    <span class="companion-say" id="companion-say"></span>
                    <img src="../../assets/generated/preschool-pixel/published/star-companion.png?v=20260815-s1" alt="星芒" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'🦄'}))">
                </div>
            </div>
            <div class="control-row">
                <button type="button" id="spawn-btn">来一波僵尸</button>
                <button type="button" id="restart-btn">重开本关</button>
                <button type="button" id="back-map-btn">返回地图</button>
            </div>
            <p class="hint" id="message-tip">选种子点草坪种下。种好后僵尸会自己来，豌豆会自己打。点掉落的阳光。</p>
        </section>
    </main>
    <div class="settle-layer is-hidden" id="settle-layer" role="dialog" aria-label="本局结算">
        <div class="settle-card">
            <h3 id="settle-title">通关！</h3>
            <p class="settle-gain" id="settle-gain"></p>
            <p class="settle-companion" id="settle-companion"></p>
            <div class="settle-progress">
                <p id="settle-progress-label"></p>
                <div class="settle-bar"><span id="settle-bar-fill"></span></div>
            </div>
            <p class="settle-goal" id="settle-goal"></p>
            <div class="settle-actions">
                <button type="button" id="settle-retry-btn">再玩一次</button>
                <button type="button" id="settle-map-btn">回到关卡图</button>
            </div>
        </div>
    </div>
    <div class="celebrate-layer is-hidden" id="celebrate-layer" role="dialog" aria-label="里程碑庆祝">
        <div class="celebrate-card">
            <img src="../../assets/generated/preschool-pixel/published/star-companion.png?v=20260815-s1" alt="星芒庆祝" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'🦄'}))">
            <p class="celebrate-kicker">里程碑点亮</p>
            <h3 id="celebrate-title"></h3>
            <p class="celebrate-sub" id="celebrate-sub"></p>
            <button type="button" id="celebrate-close-btn">收下</button>
        </div>
    </div>
    <div class="rest-layer is-hidden" id="rest-layer" role="dialog" aria-label="花园休息">
        <div class="rest-card">
            <h3 id="rest-title">花园也要午睡啦</h3>
            <p id="rest-copy">今天已经守得很棒。去做一张字卡或一项今日任务，星芒就给你新的守护次数。</p>
            <p class="rest-pass" id="rest-pass"></p>
            <div class="rest-actions">
                <a class="rest-learn" id="rest-learn-link" href="../../preschool-workbench/index.html?theme=garden-defense#courses">去做今日学习</a>
                <button type="button" id="rest-redeem-btn">用阳光再守一次</button>
                <button type="button" id="rest-workbench-btn">回工作台看成就</button>
            </div>
        </div>
    </div>
    <div class="toast-game" id="toast" role="status"></div>
    <script src="../shared/workbench-bridge.js?v=20260816-pass-v2"></script>
    <script src="../shared/game-sfx.js?v=20260815-sfx-v1"></script>
    <script src="../../preschool-garden.js?v=20260816-skill-v1"></script>
    <script src="./data/stages.js?v=20260816-skill-v1"></script>
    <script src="./game.js?v=20260816-pass-v1"></script>
</body>
</html>
