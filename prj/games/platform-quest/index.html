<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#e54139">
    <title>横版闯关 · 成长关卡</title>
    <link rel="stylesheet" href="../shared/growth-hud.css">
    <link rel="stylesheet" href="./game.css?v=20260814-play-v3">
</head>
<body data-world-game="platform-quest">
    <header class="world-bar">
        <div class="world-bar-copy">
            <span class="kicker">闯关</span>
            <h1>横版闯关</h1>
            <p>跑、跳、吃金币、冲旗。</p>
        </div>
        <div class="growth-hud" id="wallet-hud"></div>
        <div class="world-bar-actions">
            <button type="button" class="world-tool" id="map-btn">关卡</button>
            <button type="button" class="world-tool" id="fullscreen-btn">全屏</button>
            <a class="world-back" id="back-link" href="../../preschool-workbench/index.html?theme=platform-quest#overview">返回工作台</a>
        </div>
    </header>
    <main class="world-shell">
        <section class="world-panel" id="panel-map">
            <h2 class="panel-title">选关 · 10</h2>
            <div class="stage-map" id="level-map"></div>
        </section>
        <section class="world-panel is-hidden" id="panel-play">
            <div class="play-meta">
                <strong id="level-title">第 1 关</strong>
                <span>金币 <b id="coin-count">0</b></span>
                <span>姿势 <b id="pose-label">站立</b></span>
                <span>状态 <b id="run-status">准备</b></span>
            </div>
            <canvas id="world-canvas" width="960" height="480" aria-label="横版闯关画布"></canvas>
            <p class="hint">左跑、右跑、跳（可二段跳）、按住奔跑。碰到会闪一下，掉坑回到刚才的地方。</p>
            <div class="control-row">
                <button type="button" data-hold="left">左跑</button>
                <button type="button" data-action="jump">跳跃</button>
                <button type="button" data-hold="right">右跑</button>
                <button type="button" data-hold="run">奔跑</button>
                <button type="button" id="restart-btn">重开</button>
                <button type="button" id="back-map-btn">地图</button>
            </div>
        </section>
        <aside class="world-side">
            <h2>怎么玩</h2>
            <ul>
                <li>踩怪</li>
                <li>吃金币</li>
                <li>冲到旗</li>
                <li>空中再跳一次</li>
            </ul>
            <p class="tip" id="progress-tip">加载中…</p>
        </aside>
    </main>
    <div class="toast-game" id="toast"></div>
    <script src="../shared/workbench-bridge.js"></script>
    <script src="./data/physics.js?v=20260814-play-v3"></script>
    <script src="./data/levels.js?v=20260814-play-v3"></script>
    <script src="./game.js?v=20260814-play-v3"></script>
</body>
</html>
