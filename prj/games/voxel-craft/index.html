<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>方块世界 · 挖放乐园</title>
    <link rel="stylesheet" href="./game.css?v=20260816-bar-v1">
</head>
<body class="vc-body">
    <aside class="vc-side" id="vc-side" aria-label="方块世界工作台导航">
        <div class="vc-side-brand">
            <span class="vc-side-logo">⛏️</span>
            <span><b>方块世界工作台</b><small>VOXEL CRAFT</small></span>
        </div>
        <div class="vc-side-label">探险路线</div>
        <nav class="vc-side-nav" id="vc-side-nav"></nav>
        <div class="vc-side-foot">本地模式 · 方块世界</div>
    </aside>
    <div class="vc-shell">
    <header class="vc-topbar">
        <div class="vc-bar-copy">
            <span class="vc-bar-kicker">方块</span>
            <h1>方块世界</h1>
            <p>挖、放、做任务。</p>
        </div>
        <div class="vc-bar-stats" aria-label="今日状态">
            <span class="vc-chip"><img class="vc-chip-ico" src="./assets/mc/items/stone-pickaxe.png" alt="">矿工 <b id="rank-label">1 · 新手矿工</b></span>
            <span class="vc-chip"><img class="vc-chip-ico" src="./assets/mc/blocks/grass-block.png" alt="">地图 <b id="biome-label">草原</b></span>
            <span class="vc-chip"><img class="vc-chip-ico" src="./assets/mc/items/chest.png" alt="">任务 <b id="quest-done">0</b>/<b id="quest-total">18</b></span>
            <span class="vc-chip">还可挖 <b id="pass-label">1</b> 段</span>
            <span class="vc-chip">本段 <b id="segment-label">未开始</b></span>
            <span class="vc-chip vc-hp-chip"><img class="vc-chip-ico" src="./assets/ui/heart.png" alt="">生命 <b id="hp-label">5/5</b></span>
            <span class="vc-chip"><img class="vc-chip-ico" src="./assets/mc/items/wooden-sword.png" alt="">敌人 <b id="enemy-label">0</b></span>
            <span class="vc-chip">阳光 <b id="sun-label">0</b></span>
        </div>
        <div class="vc-bar-actions">
            <button type="button" class="vc-tool" id="map-btn" title="地图册"><img src="./assets/mc/blocks/grass-block.png" alt="">地图</button>
            <button type="button" class="vc-tool vc-attack-btn" id="attack-btn" title="攻击 (K)"><img src="./assets/mc/items/wooden-sword.png" alt="">攻击</button>
            <button type="button" class="vc-tool" id="bag-btn" title="背包 (E)"><img src="./assets/mc/items/chest.png" alt="">背包</button>
            <button type="button" class="vc-tool" id="home-shot-btn" title="拍下家园">拍照</button>
            <button type="button" class="vc-tool" id="reset-btn" title="重开世界">重开</button>
            <button type="button" class="vc-tool" id="fullscreen-btn">全屏</button>
            <a class="vc-back" id="back-link" href="../../preschool-workbench/index.html?theme=voxel-adventure#overview">返回工作台</a>
        </div>
    </header>

    <main class="vc-stage">
        <div class="vc-view">
            <canvas id="world-canvas" width="960" height="540" aria-label="方块世界"></canvas>
            <div class="vc-mine-ring" id="mine-ring" hidden aria-hidden="true"></div>
            <div class="vc-quest-hud">
                <strong id="quest-title">加载中…</strong>
                <div class="vc-quest-bar"><i id="quest-bar-fill"></i></div>
                <small id="quest-desc"></small>
            </div>
            <div class="vc-hud">
                <div class="vc-pad" id="move-pad">
                    <button type="button" data-hold="left" aria-label="左">◀</button>
                    <button type="button" data-hold="jump" aria-label="跳">▲</button>
                    <button type="button" data-hold="right" aria-label="右">▶</button>
                </div>
                <p class="vc-hint">按住挖 · 右键/长按放 · A/D 走 · 空格跳 · K/⚔ 攻击</p>
            </div>
        </div>
        <div class="vc-hotbar-row">
            <div class="vc-hotbar-wrap">
                <div class="vc-survival-hud" id="survival-hud">
                    <div class="vc-hearts" id="hearts" aria-label="生命"></div>
                    <div class="vc-food" id="food-bar" aria-label="饥饿"></div>
                </div>
                <div class="vc-hotbar" id="hotbar" aria-label="快捷栏"></div>
            </div>
        </div>
    </main>

    <div class="vc-toast" id="toast"></div>

    <div class="vc-layer is-hidden" id="map-layer" role="dialog" aria-label="地图册">
        <div class="vc-panel vc-map-panel">
            <div class="vc-panel-head">
                <strong>探险地图册</strong>
                <button type="button" class="vc-btn" id="map-close-btn" title="关闭地图册">✕</button>
            </div>
            <p class="vc-map-copy" id="map-copy">选择一张地图开始探险。完成任务后会解锁更多区域。</p>
            <div class="vc-map-grid" id="map-grid"></div>
        </div>
    </div>

    <span id="companion-say" hidden></span>
    <div class="vc-layer is-hidden" id="bag-layer" role="dialog" aria-label="背包与合成">
        <div class="vc-mc-panel">
            <div class="vc-mc-tabs" id="bag-tabs">
                <button type="button" data-tab="craft" class="is-on" title="合成">🔨</button>
                <button type="button" data-tab="book" title="配方书">📖</button>
                <button type="button" data-tab="smelt" title="熔炉">🔥</button>
                <button type="button" data-tab="shop" title="小卖部">☀</button>
                <span class="vc-mc-spacer"></span>
                <span class="vc-mc-sun" id="bag-sun">☀ 0</span>
                <button type="button" class="vc-mc-lock" id="parent-lock-btn" title="家长锁">🔓</button>
                <button type="button" class="vc-mc-lock" id="bag-close-btn" title="关闭 (E)">✕</button>
            </div>
            <div class="vc-mc-body" id="tab-craft">
                <div class="vc-mc-craftrow">
                    <div class="vc-craft-grid size2" id="craft-grid"></div>
                    <span class="vc-craft-arrow">➜</span>
                    <button type="button" class="vc-mc-slot vc-craft-out" id="craft-out" title="点一下拿走产物"></button>
                    <small class="vc-craft-size" id="craft-size-label">2×2</small>
                </div>
                <div class="vc-survival-hud vc-survival-hud-bag">
                    <div class="vc-hearts" id="bag-hearts" aria-label="生命"></div>
                    <div class="vc-food" id="bag-food" aria-label="饥饿"></div>
                </div>
                <div class="vc-mc-inv" id="bag-grid"></div>
            </div>
            <div class="vc-mc-body is-hidden" id="tab-book">
                <div class="vc-mc-rows" id="recipe-grid"></div>
            </div>
            <div class="vc-mc-body is-hidden" id="tab-smelt">
                <div class="vc-mc-rows" id="smelt-grid"></div>
            </div>
            <div class="vc-mc-body is-hidden" id="tab-shop">
                <div class="vc-mc-rows" id="shop-grid"></div>
            </div>
        </div>
    </div>

    <div class="vc-layer is-hidden" id="settle-layer" role="dialog" aria-label="任务结算">
        <div class="vc-panel vc-settle">
            <p class="vc-kicker">任务完成</p>
            <h3 id="settle-title"></h3>
            <p class="vc-gain" id="settle-gain"></p>
            <p class="vc-line" id="settle-progress"></p>
            <p class="vc-line" id="settle-next"></p>
            <button type="button" class="vc-btn vc-primary" id="settle-close-btn">继续探险</button>
        </div>
    </div>

    <div class="vc-layer is-hidden" id="rest-layer" role="dialog" aria-label="方块休息">
        <div class="vc-panel vc-settle">
            <h3 id="rest-title">矿工也要午睡啦</h3>
            <p class="vc-line" id="rest-copy">这一段挖得很棒。去做一张字卡或一项今日任务，星芒就给你下一段挖掘。</p>
            <p class="vc-line" id="rest-pass"></p>
            <div class="vc-rest-actions">
                <a class="vc-btn vc-primary" id="rest-learn-link" href="../../preschool-workbench/index.html?theme=voxel-adventure#courses">去做今日学习</a>
                <button type="button" class="vc-btn" id="rest-redeem-btn">用阳光再挖一段</button>
                <button type="button" class="vc-btn" id="rest-workbench-btn">回工作台看成就</button>
            </div>
        </div>
    </div>

    <div class="vc-layer is-hidden" id="rankup-layer" role="dialog" aria-label="升段仪式">
        <div class="vc-panel vc-settle">
            <img class="vc-rank-img" src="./assets/mc/items/stone-pickaxe.png" alt="新镐子" id="rankup-img">
            <p class="vc-kicker">段位提升</p>
            <h3 id="rankup-title"></h3>
            <p class="vc-line" id="rankup-sub"></p>
            <button type="button" class="vc-btn vc-primary" id="rankup-close-btn">收下</button>
        </div>
    </div>

    <script src="../shared/workbench-bridge.js?v=20260816-pass-v2"></script>
    <script src="../shared/game-sfx.js?v=20260815-sfx-v1"></script>
    <script src="./data/quests.js?v=20260815-craft-v22"></script>
    <script src="./data/maps.js?v=20260816-map-v2"></script>
    <script src="./data/enemies.js?v=20260816-enemy-v1"></script>
    <script src="./data/world.js?v=20260816-craft-v27"></script>
    <script src="./engine.js?v=20260816-craft-v27"></script>
    <script src="./game.js?v=20260816-pass-v2"></script>
</div>
</body>
</html>
