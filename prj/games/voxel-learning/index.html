<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#102842">
    <title>方块探险 · 10 张卡</title>
    <link rel="stylesheet" href="./game.css">
</head>
<body data-world-game="voxel-learning">
    <main class="game-shell" id="game-shell">
        <header class="game-hud">
            <div class="brand"><span class="brand-mark">◆</span><span><b>方块探险</b><small>10 张卡</small></span></div>
            <div class="progress-wrap" aria-label="学习卡进度"><span>学习能量</span><div class="progress-track"><i id="learning-progress"></i></div><strong id="learning-count">0/10</strong></div>
            <div class="hud-actions"><button class="icon-button" id="sound-button" type="button" aria-label="听音" aria-pressed="true">🔊</button><a class="icon-button" id="back-link" href="#" aria-label="返回工作台">↩</a></div>
        </header>
        <section class="game-stage" aria-label="方块探险场景">
            <canvas id="battle-canvas" width="1280" height="620" aria-label="方块探险画布"></canvas>
            <div class="stage-tip" id="stage-tip" role="status">每两次成功采集或放置，就会落下一张学习卡。</div>
            <div class="touch-controls" aria-label="触屏控制">
                <button type="button" data-control="left" aria-label="向左">◀</button><button type="button" data-control="right" aria-label="向右">▶</button>
                <button type="button" data-control="mine" aria-label="挖掘方块">⛏</button><button type="button" data-control="place" aria-label="放置方块">▣</button><button type="button" data-control="jump" aria-label="跳跃">⬆</button>
            </div>
        </section>
        <footer class="game-footer"><span id="inventory-label">方块 × 3</span><span id="portal-label">学习 10 张后开启传送门</span><button id="start-button" class="primary-button" type="button">开始探险</button><button id="portal-button" class="primary-button is-hidden" type="button">进入最终传送门</button></footer>
    </main>

    <section class="learning-card-layer is-hidden" id="learning-card-layer" role="dialog" aria-modal="true" aria-labelledby="card-prompt">
        <article class="learning-card" id="learning-card"><div class="card-head"><span id="card-track-label">识字卡</span><button id="speak-button" type="button" class="speak-button" aria-label="听音">🔊 再听一次</button></div><strong id="card-symbol">山</strong><h2 id="card-prompt">“山”是哪一张图？</h2><div class="answer-grid" id="answer-grid"></div><p id="card-feedback" role="status"></p><button id="correction-button" type="button" class="correction-button is-hidden">我记住了，继续探险</button></article>
    </section>
    <section class="orientation-lock" id="orientation-lock" aria-label="请旋转设备"><div class="rotate-icon">↻</div><h2>请把设备横过来</h2><p>横屏才能看到完整的方块世界。</p></section>

    <script src="../shared/workbench-bridge.js"></script>
    <script src="../../preschool-speech.js"></script>
    <script src="./core/learning-adapter.js"></script>
    <script src="./data/cards.js"></script>
    <script src="./game.js"></script>
</body>
</html>
