<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#5dade2">
    <title>方块世界</title>
    <link rel="stylesheet" href="../shared/growth-hud.css">
    <link rel="stylesheet" href="./game.css?v=20260814-art-v2">
</head>
<body data-world-game="voxel-adventure" class="mc-world">
    <header class="world-bar mc-top">
        <div class="world-bar-copy">
            <span class="kicker">关卡</span>
            <h1>方块世界</h1>
            <p id="quest-title">方块世界 · 挖一挖、放一放</p>
        </div>
        <div class="growth-hud" id="wallet-hud"></div>
        <div class="world-bar-actions">
            <button type="button" class="world-tool" id="reset-btn">重开本关</button>
            <button type="button" class="world-tool" id="fullscreen-btn">全屏</button>
            <a class="world-back" id="back-link" href="../../preschool-workbench/index.html?theme=voxel-adventure#overview">返回工作台</a>
        </div>
    </header>
    <main class="world-shell mc-stage">
        <section class="world-panel mc-panel">
            <div class="play-meta is-hidden">
                <span>进度 <b id="quest-count">0</b>/<b id="quest-need">8</b></span>
                <span>状态 <b id="run-status">准备</b></span>
            </div>
            <div class="mc-view">
                <canvas id="world-canvas" width="960" height="540" aria-label="方块家园"></canvas>
                <div class="mc-hud">
                    <div class="control-row" id="move-pad">
                        <button type="button" data-hold="left" aria-label="左">◀</button>
                        <button type="button" data-hold="right" aria-label="右">▶</button>
                        <button type="button" data-hold="jump" aria-label="跳">▲</button>
                    </div>
                    <button type="button" class="mc-refresh" id="hud-refresh">重开</button>
                    <p class="hint mc-hint" id="message-tip">点击挖矿 | 右键/长按放置 | 走到出口</p>
                    <div class="mc-stats">
                        <span>背包物品 <b id="bag-count">0</b></span>
                        <span>坐标 <b id="coord-label">0,0</b></span>
                    </div>
                </div>
            </div>
            <div class="hotbar" id="hotbar" aria-label="工具和背包"></div>
            <p class="mc-footer">方块世界 — WASD 移动 | 空格跳跃 | 鼠标左键挖矿 | 右键/长按放置 | 走到出口</p>
        </section>
        <aside class="world-side mc-quests">
            <h2>关卡</h2>
            <div class="quest-list" id="quest-list"></div>
            <p class="tip" id="progress-tip">加载中…</p>
        </aside>
    </main>
    <div class="toast-game" id="toast"></div>
    <script src="../shared/workbench-bridge.js"></script>
    <script src="./data/quests.js?v=20260814-mc-v1"></script>
    <script src="./data/levels.js?v=20260814-regions-v1"></script>
    <script src="./data/world.js?v=20260814-tools-v1"></script>
    <script src="./pixel-tiles.js?v=20260814-art-v2"></script>
    <script src="./game.js?v=20260814-idle-v1"></script>
</body>
</html>
