<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#2c315c">
    <title>方块世界 · 史蒂夫横版</title>
    <link rel="stylesheet" href="../shared/growth-hud.css">
    <link rel="stylesheet" href="./game.css">
</head>
<body data-world-game="voxel-adventure">
    <header class="world-bar">
        <div class="world-bar-copy">
            <span class="kicker">STEVE · SIDE SCROLL · COMBAT</span>
            <h1>方块世界</h1>
            <p>史蒂夫横版过关：跑跳、踩怪、收集晶体。进度写回工作台。</p>
        </div>
        <div class="growth-hud" id="wallet-hud"></div>
        <div class="world-bar-actions">
            <button type="button" class="world-tool" id="map-btn">关卡</button>
            <button type="button" class="world-tool" id="fullscreen-btn">全屏</button>
            <a class="world-back" id="back-link" href="../../preschool-workbench/index.html?theme=voxel-adventure#overview">返回工作台</a>
        </div>
    </header>
    <main class="world-shell">
        <section class="world-panel" id="panel-map">
            <h2 class="panel-title">方块关卡 · 共 8 关</h2>
            <div class="stage-map" id="level-map"></div>
        </section>
        <section class="world-panel is-hidden" id="panel-play">
            <div class="play-meta">
                <strong id="level-title">第 1 关</strong>
                <span>晶体 <b id="crystal-count">0</b></span>
                <span>状态 <b id="run-status">准备</b></span>
            </div>
            <canvas id="world-canvas" width="960" height="480" aria-label="史蒂夫横版"></canvas>
            <p class="hint">方向键/WASD 移动，空格跳跃。踩扁绿色怪物，收集晶体，冲向终点旗。</p>
            <div class="control-row">
                <button type="button" data-hold="left">左跑</button>
                <button type="button" data-action="jump">跳跃</button>
                <button type="button" data-hold="right">右跑</button>
                <button type="button" id="restart-btn">重开</button>
                <button type="button" id="back-map-btn">地图</button>
            </div>
        </section>
        <aside class="world-side">
            <h2>史蒂夫冒险</h2>
            <ul>
                <li>踩怪可以消灭敌人</li>
                <li>碰到侧面会重来</li>
                <li>晶体可带回工作台进度</li>
            </ul>
            <p class="tip" id="progress-tip">加载中…</p>
        </aside>
    </main>
    <div class="toast-game" id="toast"></div>
    <script src="../shared/workbench-bridge.js"></script>
    <script src="./data/quests.js"></script>
    <script src="./data/levels.js"></script>
    <script src="./game.js"></script>
</body>
</html>
