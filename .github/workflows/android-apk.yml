name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run packaging contracts
        run: node --test --test-concurrency=1 tests/prepare-mobile.test.mjs tests/release-contract.test.mjs tests/project-layout.test.mjs tests/release-asset-allowlist.test.mjs

      - name: Verify published launcher contract
        run: npm run release:verify

      - name: Check JavaScript entry points
        run: |
          node --check prj/launcher.js
          node --check prj/app.js
          node --check prj/storage.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate Android project
        run: npm run android:init

      - name: Sync web assets into Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          test -s android/app/release.jks

      - name: Stamp Android version and signing
        run: node scripts/stamp-android-release.mjs

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK is non-empty
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "personal-workbench-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-workbench-apk-${{ github.ref_name }}
          path: personal-workbench-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: personal-workbench-${{ github.ref_name }}.apk
